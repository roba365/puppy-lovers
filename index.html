<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puppy lovers</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="page-title">
      <h1>Puppy lovers page</h1>
    </header>

    <main class="content">
      <section class="banner-section">
        <img src="/images/banner-puppies.jpg" alt="banner puppy" />
      </section>
      <div class="container">
        <section class="grid-three">
          <div class="card">
            <img src="/images/puppy-1.jpg" alt="puppy 1">
          </div>
          <div class="card missing-box">
            <p>Puppy <br> missing <br> here!!</p>
          </div>
          <div class="card">
            <img src="/images/puppy-2.jpg" alt="puppy 2">
          </div>
        </section>

        <section class="more-puppies-section">
          <h2>More Puppies</h2>
          <div class="grid-two">
            <div class="card">
              <img src="/images/puppy-3.jpg" alt="puppy 3">
            </div>
            <div class="card">
              <img src="/images/puppy-4.jpg" alt="puppy 4">
            </div>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <p>Developed by: Robel A.</p>
    </footer>
  </body>
</html>
